<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="tailwind-config.js"></script>
    <link rel="stylesheet" href="styles.css" id="theme-stylesheet">
</head>
<body class="bg-custom-bg text-custom-text font-['Inter'] min-h-screen p-8 md:p-16 leading-relaxed">
    <main class="max-w-6xl mx-auto">
        <!-- Design Switcher Button -->
        <div style="position: fixed; top: 20px; right: 20px; z-index: 999;">
            <button id="design-switcher" class="px-4 py-2 rounded-lg font-semibold text-sm transition-all"
                style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); cursor: pointer;">
                🎨 Design: Current
            </button>
        </div>

        <!-- Header and Nav will be loaded here -->
        <div id="header-container"></div>
        
        <!-- Content will be loaded here -->
        <div id="content-container"></div>
        
        <!-- Footer will be loaded here -->
        <div id="footer-container"></div>
    </main>

    <!-- Popup Modal -->
    <div id="imagePopup" class="popup-modal">
        <span class="popup-close" onclick="closePopup()">&times;</span>
        <img class="popup-content" id="popupImage">
        <div id="popupCaption" class="text-center text-white mt-4 text-lg font-medium"></div>
    </div>

    <script src="script.js"></script>
    <script src="design-switcher.js"></script>
    <script>
        // Load content files
        async function loadContent() {
            try {
                // Load header
                const headerRes = await fetch('header-content.html');
                document.getElementById('header-container').innerHTML = await headerRes.text();
                
                // Load main content
                const contentRes = await fetch('content.html');
                document.getElementById('content-container').innerHTML = await contentRes.text();
                
                // Load footer
                const footerRes = await fetch('footer-content.html');
                document.getElementById('footer-container').innerHTML = await footerRes.text();
                
                // Reinitialize event listeners after content loads
                updateActiveNav();
            } catch (error) {
                console.error('Error loading content:', error);
            }
        }
        
        // Load content when page loads
        document.addEventListener('DOMContentLoaded', loadContent);
    </script>
</body>
</html>
